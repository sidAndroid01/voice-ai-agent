[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time streaming voice AI agent (cascaded STT -> LLM -> TTS on LiveKit Agents)"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,noise-cancellation,openai,silero,turn-detector]>=1.8.5",
    "livekit-plugins-noise-cancellation>=0.3.2",
    "num2words>=0.5.14",
    "python-dotenv>=1.2.4",
    "redis>=5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
